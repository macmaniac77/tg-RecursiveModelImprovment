const data=JSON.parse(document.getElementById('data').textContent), content=document.getElementById('content'), detail=document.getElementById('detail');

function json(label,value,parent=detail){el('h3',label,parent);el('pre',JSON.stringify(value??'Unknown / not materialized',null,2),parent)}

el('small',block?'dictionary':graph?'graph definition':'unresolved',s);if(trail.includes(name)){el('p','Cycle: expansion stopped.',d);return}let built=false;d.addEventListener('toggle',()=>{if(!d.open||built)return;built=true;if(children?.length)children.forEach(c=>aoiBranch(c,d,[...trail,name]));else el('p',graph?'Inspect canonical nodes in the detail panel.':'No further decomposition declared.',d)});}

function hierarchy(){el('h2','Mapped model hierarchy',content);el('p','Nesting follows canonical ID prefixes. Wildcards denote groups with unknown instance counts; this is not a tensor dataflow graph.',content);const bar=el('div',undefined,content,'toolbar');el('button','Expand mapped blocks',bar).onclick=()=>content.querySelectorAll('details').forEach(d=>d.open=true);el('button','Collapse all',bar).onclick=()=>content.querySelectorAll('details').forEach(d=>d.open=false);aoiBranch(data.model.root_aoi,content);data.nodes.filter(n=>!n.parent).forEach(n=>mappedBranch(n,content));}
function overview(){el('h2','Model block overview',content);el('p','Semantic composition from the dictionary. Ordering does not assert edges, layer counts, or execution support.',content);const flow=el('div',undefined,content,'flow');for(const name of data.blocks[data.model.root_aoi]?.children||[]){const c=el('div',undefined,flow,'card');el('button',name,c).onclick=()=>select(name);const mappings=data.nodes.filter(n=>n.aoi===name);el('small',mappings.map(n=>n.id).join(', ')||'Semantic definition; instance mapping not declared',c);}json('Parameter materialization',data.parameter_materialization,content);}
function catalogView(){el('h2','AOI capability audit',content);const items=Object.entries(data.catalog);el('p',`${items.length} default/variant definitions · ${items.filter(([,v])=>v.audit.status==='lowerable').length} with complete primitive coverage`,content);el('div','Structural validation does not prove type safety, correct parameter binding, or numerical equivalence.',content,'notice');const search=el('input',undefined,content);search.placeholder='Filter AOIs or execution gaps';search.setAttribute('aria-label','Filter AOIs');const list=el('div',undefined,content);function draw(){list.replaceChildren();items.filter(([k,v])=>(k+' '+v.audit.issues.join(' ')).toLowerCase().includes(search.value.toLowerCase())).forEach(([k,v])=>{const c=el('div',undefined,list,'card');el('button',k,c).onclick=()=>select(k);el('span',v.audit.status,c,'badge '+(v.audit.status==='lowerable'?'ok':''));el('small',` · ${v.graph.nodes.length} nodes · ${v.audit.issues.length} execution gaps`,c)})}search.oninput=draw;draw();}
function graphs(){el('h2','Canonical graph inspection',content);el('p','Add --graph model.arch.json when exporting. Dependencies below come directly from canonical IR.',content);if(!data.graphs.length)el('div','No model.arch.json supplied. The RF-DETR map is a structural source map, not a fully lowered model.',content,'notice');for(const item of data.graphs){el('h3',item.graph.name,content);json('Audit',item.audit,content);const t=el('table',undefined,content),head=el('tr',undefined,t);['Node','Operation','Inputs'].forEach(v=>el('th',v,head));for(const n of item.graph.nodes){const row=el('tr',undefined,t);const cell=el('td',undefined,row);el('button',n.id,cell).onclick=()=>{detail.replaceChildren();json('Canonical node',n)};el('td',n.op,row);el('td',n.inputs.join(', '),row)}}}
function loop(){el('h2','Measured improvement loop',content);el('div','Not implemented end to end in the reviewed baseline. No measured improvements or champions are claimed.',content,'notice');const rows=[['Architecture & AOIs','Reusable AOIs exist; full RF-DETR translation remains incomplete.'],['Training','RF-DETR train.py exists outside the generic candidate loop.'],['Evaluation','benchmark_adapter.py raises NotImplementedError.'],['Controlled comparison','No runnable parent/candidate harness, matched benchmark protocol, or measured baseline artifacts.'],['Decision & provenance','Cascade YAML describes intent; no executable promotion gates or experiment ledger.']];const t=el('table',undefined,content);for(const row of rows){const tr=el('tr',undefined,t);row.forEach(v=>el('td',v,tr))}el('p','This is a review snapshot, not live run status. See docs/REVIEW_VIEWER_AND_LOOP.md for evidence and the next implementation contract.',content);}

function sourceURL(file){return /^https:\/\/github\.com\/tinygrad\/tinygrad\/blob\/[0-9a-f]{40}\//.test(file.source_url)?file.source_url:'#'}
function sourceSymbol(file,symbol){
  detail.replaceChildren();el('h2',symbol.name,detail);
  el('p',file.path+':'+symbol.line+' · '+symbol.kind,detail);
  el('div','Source projection only. Calls are lexical occurrences, not tensor execution order or verified runtime bindings.',detail,'notice');
  const link=el('a','Open pinned upstream source',detail);link.href=sourceURL(file)+'#L'+symbol.line;link.target='_blank';link.rel='noopener noreferrer';
  if(symbol.library_aoi){el('h3','Reusable library block',detail);el('button',symbol.library_aoi,detail).onclick=()=>select(symbol.library_aoi);el('p',symbol.library_scope,detail);}
  json('Signature',symbol.signature);const children=file.symbols.filter(x=>x.parent===symbol.id);
  if(children.length){el('h3','Nested definitions',detail);for(const child of children)el('button',child.name,detail).onclick=()=>sourceSymbol(file,child);}
  el('h3',symbol.calls.length+' source calls',detail);
  for(const call of symbol.calls){const d=el('details',undefined,detail);el('summary',call.expression+' · '+(call.aoi||call.candidate_aoi||call.status),d);
    if(call.aoi){el('p','Tinygrad API → AOI vocabulary mapping; arguments and modes still require validation.',d);el('button','Inspect '+call.aoi,d).onclick=()=>select(call.aoi);}
    if(call.candidate_aoi)el('p','Candidate only: receiver type is not statically proven.',d);
    if(call.target){const target=sourceIndex.get(call.target);if(target)el('button','Follow source definition',d).onclick=()=>sourceSymbol(...target);}
    json('Source call',call,d);
  }
}
const sourceIndex=new Map();
for(const file of data.examples?.files||[])for(const symbol of file.symbols)sourceIndex.set(symbol.id,[file,symbol]);
function exampleView(){
  el('h2','Tinygrad example library',content);
  if(!data.examples){el('div','Load the catalog with --examples reference_models/tinygrad/catalog.json',content,'notice');return;}
  const pack=data.examples;el('p',pack.summary.python_files+' Python files · '+pack.summary.symbols+' definitions · revision '+pack.upstream.revision.slice(0,12),content);
  el('div','Every tracked example/support file is inventoried. Python structure is inspectable; unknown calls are OPAQUE. This is not full-model executable translation.',content,'notice');
  const search=el('input',undefined,content);search.placeholder='Find YOLOv8, llama, Conv2d, source class…';search.setAttribute('aria-label','Search Tinygrad examples');
  const list=el('div',undefined,content);
  function draw(){list.replaceChildren();const q=search.value.toLowerCase();
    for(const file of pack.files){if(!file.path.toLowerCase().includes(q)&&!file.symbols.some(s=>s.name.toLowerCase().includes(q)))continue;
      const d=el('details',undefined,list), summary=el('summary',file.path,d);el('small',' · '+file.status,summary);
      let built=false;d.addEventListener('toggle',()=>{if(!d.open||built)return;built=true;
        el('p',file.sha256,d);if(file.error)el('p',file.error,d);
        const link=el('a','Pinned source',d);link.href=sourceURL(file);link.target='_blank';link.rel='noopener noreferrer';
        function branch(symbol,parent){const box=el('details',undefined,parent),title=el('summary',undefined,box),b=el('button',symbol.name,title);b.onclick=e=>{e.preventDefault();sourceSymbol(file,symbol)};
          el('small',symbol.kind+' · '+symbol.calls.length+' calls',title);for(const child of file.symbols.filter(s=>s.parent===symbol.id))branch(child,box);}
        for(const symbol of file.symbols.filter(s=>!s.parent))branch(symbol,d);
      });
    }
  }search.oninput=draw;draw();
}
const views={hierarchy,overview,catalog:catalogView,graphs,loop,examples:exampleView};function show(name){content.replaceChildren();document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===name)));views[name]()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));document.getElementById('subtitle').textContent=data.model.id+' · offline / read-only';show('hierarchy');
</script></body></html>
